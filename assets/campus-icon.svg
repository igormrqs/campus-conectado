  <circle cx="670" cy="656" r="40" fill="#314BCE" />
  <!-- Checkmark dentro do selo -->
  <path d="M 655 656 L 666 667 L 688 645" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
