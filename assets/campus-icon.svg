<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Fundo Papel Quente -->
  <rect width="1024" height="1024" fill="#F7F5EF" />

  <!-- Caderno Editorial Principal (Tinta #171A21) -->
  <rect x="215" y="184" width="594" height="656" rx="76" ry="76" fill="#171A21" />

  <!-- Lombada Costurada (Azul Elétrico #314BCE) -->
  <rect x="215" y="184" width="112" height="656" rx="76" ry="76" fill="#314BCE" />
  <rect x="260" y="184" width="67" height="656" fill="#314BCE" />

  <!-- Marcador / Fita de Leitura (Lima Suave #DBF57A) -->
