  <!-- Pautas Internas Muted -->
  <line x1="380" y1="360" x2="750" y2="360" stroke="#333945" stroke-width="6" stroke-linecap="round" />
  <line x1="380" y1="440" x2="750" y2="440" stroke="#333945" stroke-width="6" stroke-linecap="round" />
